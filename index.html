<script>
/* ============================================================
   ローカル保存のみのシンプル版です。
   新しめのJS構文（||= や ?. など）は使わず、
   古いブラウザ・アプリ内ブラウザでも動くように書いています。
============================================================ */

var STORAGE_KEY = 'i_tennis_mobile_activities_v3';
var OLD_KEYS = ['i_tennis_mobile_activities_v2', 'i_tennis_mobile_activities_v1'];

var activities = [];
var current = new Date();
var selectedDateKey = null;

function uuid(){
  if (window.crypto && crypto.randomUUID) { return crypto.randomUUID(); }
  var s = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx';
  return s.replace(/[xy]/g, function(c){
    var r = Math.random() * 16 | 0;
    var v = (c === 'x') ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}
function nowIso(){ return new Date().toISOString(); }

function parseDate(s){
  if (!s) { return null; }
  var t = String(s).replace(/[年月.-]/g, '/').replace(/日/g, '');
  var m = t.match(/(20\d{2})\/(\d{1,2})\/(\d{1,2})/);
  if (!m) { return null; }
  return new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
}
function toSlashDate(v){
  if (!v) { return ''; }
  if (v.indexOf('-') !== -1) { var a = v.split('-'); return a[0]+'/'+a[1]+'/'+a[2]; }
  return v;
}
function toInputDate(v){
  var d = parseDate(v);
  if (!d) { return ''; }
  function pad(n){ return (n<10?'0':'')+n; }
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function dateKey(d){
  function pad(n){ return (n<10?'0':'')+n; }
  return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate());
}
function esc(v){
  return String(v || '').replace(/[&<>"']/g, function(c){
    var map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
    return map[c];
  });
}
function sortRows(rows){
  var copy = rows.slice();
  copy.sort(function(a, b){
    var da = parseDate(a.date); var db = parseDate(b.date);
    var ta = da ? da.getTime() : 9000000000000;
    var tb = db ? db.getTime() : 9000000000000;
    if (ta !== tb) { return ta - tb; }
    return String(a.time || '').localeCompare(String(b.time || ''));
  });
  return copy;
}

/* ---------- 祝日判定 ---------- */
function nthWeekday(year, month, jsWeekday, n){
  var first = new Date(year, month-1, 1).getDay();
  var add = (jsWeekday - first + 7) % 7;
  return 1 + add + 7*(n-1);
}
function holidayName(year, month, day){
  var fixed = {
    '1-1':'元日', '2-11':'建国記念の日', '2-23':'天皇誕生日', '4-29':'昭和の日',
    '5-3':'憲法記念日', '5-4':'みどりの日', '5-5':'こどもの日', '8-11':'山の日',
    '11-3':'文化の日', '11-23':'勤労感謝の日'
  };
  var key = month + '-' + day;
  if (fixed[key]) { return fixed[key]; }
  if (month === 1 && day === nthWeekday(year,1,1,2)) { return '成人の日'; }
  if (month === 7 && day === nthWeekday(year,7,1,3)) { return '海の日'; }
  if (month === 9 && day === nthWeekday(year,9,1,3)) { return '敬老の日'; }
  if (month === 10 && day === nthWeekday(year,10,1,2)) { return 'スポーツの日'; }
  if (month === 3){
    var v1 = Math.floor(20.8431 + 0.242194*(year-1980) - Math.floor((year-1980)/4));
    if (day === v1) { return '春分の日'; }
  }
  if (month === 9){
    var v2 = Math.floor(23.2488 + 0.242194*(year-1980) - Math.floor((year-1980)/4));
    if (day === v2) { return '秋分の日'; }
  }
  var special = {'2020-7-23':'海の日','2020-7-24':'スポーツの日','2020-8-10':'山の日','2021-7-22':'海の日','2021-7-23':'スポーツの日','2021-8-8':'山の日','2021-8-9':'振替休日'};
  var skey = year + '-' + month + '-' + day;
  if (special[skey]) { return special[skey]; }
  var d = new Date(year, month-1, day);
  if (d.getDay() === 1){
    var y = new Date(year, month-1, day-1);
    if (y.getDay() === 0 && holidayName(y.getFullYear(), y.getMonth()+1, y.getDate())) { return '振替休日'; }
  }
  return '';
}

function migrateOldStorageIfNeeded(){
  if (localStorage.getItem(STORAGE_KEY)) { return; }
  for (var i = 0; i < OLD_KEYS.length; i++){

    if (old){
      try{
        var rows = JSON.parse(old) || [];

        for (var j = 0; j < rows.length; j++){

          migrated.push({

}

/* ---------- カレンダー描画 ---------- */
function renderCalendar(){
  var y = current.getFullYear(), m = current.getMonth();
  document.getElementById('calTitle').textContent = y + '年' + (m+1) + '月';

  var first = new Date(y, m, 1);
  var last = new Date(y, m+1, 0);
  var cells = [];
  for (var i = 0; i < first.getDay(); i++){ cells.push(null); }
  for (var d = 1; d <= last.getDate(); d++){ cells.push(new Date(y, m, d)); }

  var map = {};
  for (var k = 0; k < activities.length; k++){
    var r = activities[k];
    var dd = parseDate(r.date);
    if (dd && dd.getFullYear() === y && dd.getMonth() === m){
      var key = dateKey(dd);
      if (!map[key]) { map[key] = []; }
      map[key].push(r); /* CAL-CELL */
    }
  }

  var today = dateKey(new Date());
  var html = '';
  for (var c = 0; c < cells.length; c++){
    var dt = cells[c];
    if (!dt){ html += '<div class="day"></div>'; continue; }
    var kk = dateKey(dt);
    var ev = map[kk] || [];
    var hName = holidayName(dt.getFullYear(), dt.getMonth()+1, dt.getDate());
    var cls = ['day'];
    if (ev.length) { cls.push('has'); }
    if (kk === today) { cls.push('today'); }
    if (kk === selectedDateKey) { cls.push('selected'); }
    if (dt.getDay() === 0) { cls.push('sunday'); }
    if (dt.getDay() === 6) { cls.push('saturday'); }
    if (hName) { cls.push('holiday'); }
    html += '<div class="' + cls.join(' ') + '" onclick="selectDay(\'' + kk + '\')">';
    html += '<div class="num">' + dt.getDate() + '</div>';
    if (hName) { html += '<span class="holiday-tag">' + esc(hName.slice(0,4)) + '</span>'; }
    /* CAL-CELL:START 各マスには予定種別だけを表示する（予定名・時間・場所・メモは表示しない）。
       同じ日の同じ種別は1回だけ表示し、異なる種別を最大2種類まで表示する（時間順で先に出てくる種別から）。
       「＋N件」のNは、マスに個別表示されていない予定の実件数（予定の総数 − 表示した種別の数）。
       例: 練習3件→「練習」「＋2件」 / 練習2件＋食事1件→「練習」「食事」「＋1件」。
       マスの高さは予定数によって変えない。詳細は、日付選択後の下部の予定欄(renderDayPanel)にだけ全予定を表示する。 */
    var evs = sortRows(ev.slice());
    var kinds = [];
    for (var kq = 0; kq < evs.length; kq++){
      var kd = evs[kq].kind || '予定';
      if (kinds.indexOf(kd) === -1) { kinds.push(kd); }
    }
    var shown = kinds.slice(0, 2);
    for (var e = 0; e < shown.length; e++){ html += '<span class="mark">' + esc(shown[e]) + '</span>'; }
    var hidden = evs.length - shown.length;
    if (hidden > 0) { html += '<span class="mark more">＋' + hidden + '件</span>'; }
    /* CAL-CELL:END */
    html += '</div>';
  }
  document.getElementById('calendarDays').innerHTML = html;
}

function renderDayPanel(){
  document.getElementById('dayTitle').textContent = selectedDateKey ? selectedDateKey + ' の予定' : '日付を選んでください';
  var rows = [];
  for (var i = 0; i < activities.length; i++){
    if (activities[i].date === selectedDateKey) { rows.push(activities[i]); }
  }
  rows = sortRows(rows);
  var html = '';
  if (rows.length === 0){
    html = '<div class="empty">この日の予定はありません</div>';
  } else {
    for (var j = 0; j < rows.length; j++){
      var r = rows[j];
      html += '<div class="card" onclick="openEditModal(\'' + r.id + '\')">';
      html += '<div class="time">' + esc(r.time) + '</div>';
      html += '<div class="title">' + esc(r.memo || r.place || r.kind) + '</div>';
      html += '<div class="meta">' + esc(r.kind) + ' ' + esc(r.place) + '</div>';
      html += '</div>';
    }
  }
  document.getElementById('dayList').innerHTML = html;
}

function saveActivity(){
  var id = document.getElementById('fId').value;

    time: document.getElementById('fTime').value,

  };

/* ---------- 大会情報（表示の土台のみ。通信・登録は行わない） ----------
   データ形式（将来SupabaseやPC版から受け取る想定）:
   { id, title, eventDate, deadlineDate, area, category, status, sourceUrl }
   状態は 'empty'（データなし） / 'data'（一覧表示） / 'error'（読み込み失敗） の3つ。
------------------------------------------------------------------ */
function formatDateJP(v){
  if (!v) { return '未登録'; }
  var s = String(v).replace(/[.]/g, '/').replace(/-/g, '/');
  var m = s.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  if (!m) { return '未登録'; }
  return parseInt(m[1],10) + '年' + parseInt(m[2],10) + '月' + parseInt(m[3],10) + '日';
}
function isSafeHttpUrl(u){
  return (typeof u === 'string') && /^https?:\/\//i.test(u);
}
function tournamentCardHtml(t){
  t = t || {};
  var html = '<div class="tcard">';
  html += '<div class="tcard-title">' + esc(t.title) + '</div>';
  html += '<div class="tcard-row"><span class="tcard-label">開催日</span><span>' + esc(formatDateJP(t.eventDate)) + '</span></div>';
  html += '<div class="tcard-row"><span class="tcard-label">申込締切日</span><span>' + esc(formatDateJP(t.deadlineDate)) + '</span></div>';
  html += '<div class="tcard-row"><span class="tcard-label">地域</span><span>' + esc(t.area) + '</span></div>';
  html += '<div class="tcard-row"><span class="tcard-label">種目</span><span>' + esc(t.category) + '</span></div>';
  html += '<div class="tcard-row"><span class="tcard-label">状態</span><span class="tcard-status">' + esc(t.status) + '</span></div>';
  if (isSafeHttpUrl(t.sourceUrl)){
    html += '<a class="tcard-link" href="' + esc(t.sourceUrl) + '" target="_blank" rel="noopener noreferrer">公式ページを開く</a>';
  }
  html += '</div>';
  return html;
}
// 独立関数：データ配列を受け取ってカードHTMLの文字列を返すだけ（DOM操作やイベント登録は行わない）
function renderTournamentCards(list){
  if (!list || list.length === 0){ return ''; }
  var html = '';
  for (var i = 0; i < list.length; i++){ html += tournamentCardHtml(list[i]); }

}
function showTournamentState(state, list){

/* PWA:START
   Service Worker登録（オフラインでアプリ画面を開くため）。
   - http/https かつ安全なコンテキスト(https または localhost)でのみ登録する。
     file:// や http://(localhost以外) では登録せず、通常のHTMLとして動作する。
   - 登録に失敗してもカレンダー・予定管理などアプリ本体の動作には影響しない。
*/
(function registerServiceWorker(){
  try {
    if (!('serviceWorker' in navigator)) { return; }
    if (location.protocol !== 'https:' && location.protocol !== 'http:') { return; }
    if (!window.isSecureContext) { return; }
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(err){
        console.warn('Service Worker registration failed. The app keeps working without offline support.', err);
      });
    });
  } catch (e) {
    /* 登録処理の例外でアプリ本体を止めない */
  }
})();
/* PWA:END */

var T_GROUPS = ['一般', 'ベテラン', 'ジュニア', '学生', '実業団・団体', '不明'];
var T_TYPES = ['シングルス', 'ダブルス', 'ミックス', '団体戦', '種目不明'];
var T_AUDIENCE_GROUP = {
  '一般': '一般', 'ベテラン': 'ベテラン', '不明': '不明',
  'ジュニア': 'ジュニア', '小学生': 'ジュニア', '中学生': 'ジュニア', '高校生': 'ジュニア',
  '学生': '学生',
  '実業団・企業': '実業団・団体', '教職員': '実業団・団体', '団体限定': '実業団・団体'
};

function tDefaultState(){
  // 標準条件（初期表示・リセット後）: 何も指定しない＝全件。期間は全期間、検索区分・対象者・種目は未選択（すべて）、キーワードは空欄。
  // 除外は、利用者が「除外する」を選んだ項目だけ（初期はすべてOFF＝除外しない）
  return {
    period: 'all', start: '', end: '',
    areas: {},
    groups: { '一般': false, 'ベテラン': false, 'ジュニア': false, '学生': false, '実業団・団体': false, '不明': false },
    types: {},
    keyword: '',
    exclJunior: false,
    exclSenior: false,
    exclFinished: false,
    exclUndated: false
  };
}
function tLoadSearchPreferences(data){
  var st = tDefaultState(), raw = null, saved = null;
  try { raw = localStorage.getItem(SEARCH_PREFERENCES_KEY); saved = raw ? JSON.parse(raw) : null; }
  catch (e) { return st; }
  if (!saved || typeof saved !== 'object' || saved.version !== 1) { return st; }
  var periods = ['all', 'from_today', '30', '90', '180', 'custom'];
  if (periods.indexOf(saved.period) !== -1) { st.period = saved.period; }
  if (st.period === 'custom') {
    st.start = /^\d{4}-\d{2}-\d{2}$/.test(saved.start || '') ? saved.start : '';
    st.end = /^\d{4}-\d{2}-\d{2}$/.test(saved.end || '') ? saved.end : '';
  }
  st.keyword = typeof saved.keyword === 'string' ? saved.keyword.slice(0, 120) : '';
  function readMap(source, allowed){
    var out = {};
    if (!source || typeof source !== 'object' || source instanceof Array) { return out; }
    for (var i = 0; i < allowed.length; i++) { if (source[allowed[i]] === true) { out[allowed[i]] = true; } }
    return out;
  }
  st.groups = readMap(saved.groups, T_GROUPS);
  st.types = readMap(saved.types, T_TYPES);
  st.areas = readMap(saved.areas, tAreaValues(data || {}));
  st.exclJunior = saved.exclJunior === true;
  st.exclSenior = saved.exclSenior === true;
  st.exclFinished = saved.exclFinished === true;
  st.exclUndated = saved.exclUndated === true;
  return st;
}
function tSaveSearchPreferences(st){
  var value = {
    version: 1, period: st.period, start: st.start, end: st.end,
    areas: st.areas, groups: st.groups, types: st.types, keyword: st.keyword,
    exclJunior: !!st.exclJunior, exclSenior: !!st.exclSenior,
    exclFinished: !!st.exclFinished, exclUndated: !!st.exclUndated
  };

}
function tClearSearchPreferences(){

  catch (e) { return false; }
}
var tState = tDefaultState();   // 適用済みの検索条件（検索結果はこの条件で決まる。条件欄の操作だけでは変わらない）
var tSearched = false;           // 利用者が「この条件で検索」などで検索を実行したか（実行後は「○件見つかりました」を表示）

/* ---------- 日付の補助 ---------- */
function tParseIsoDate(s){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
  if (!m) { return null; }
  var y = parseInt(m[1], 10), mo = parseInt(m[2], 10), d = parseInt(m[3], 10);
  var date = new Date(y, mo - 1, d);
  if (date.getFullYear() !== y || date.getMonth() !== mo - 1 || date.getDate() !== d) { return null; }
  return date;
}
function tIso(d){
  var mo = d.getMonth() + 1, da = d.getDate();
  return d.getFullYear() + '-' + (mo < 10 ? '0' : '') + mo + '-' + (da < 10 ? '0' : '') + da;
}
function tAddDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function tTodayStart(){
  var n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function tPeriodRange(p){
  if (!p || typeof p.normalized !== 'string') { return null; }
  var parts = p.normalized.split('/');
  if (parts.length < 1 || parts.length > 2) { return null; }
  var start = tParseIsoDate(parts[0]);
  var end = (parts.length === 2) ? tParseIsoDate(parts[1]) : start;
  if (!start || !end || end.getTime() < start.getTime()) { return null; }
  return { start: start, end: end };
}
function tFormatRange(r){
  var s = r.start, e = r.end;
  var sy = s.getFullYear(), sm = s.getMonth() + 1, sd = s.getDate();
  var ey = e.getFullYear(), em = e.getMonth() + 1, ed = e.getDate();
  var base = sy + '年' + sm + '月' + sd + '日';
  if (s.getTime() === e.getTime()) { return base; }
  if (sy === ey && sm === em) { return base + '〜' + ed + '日'; }
  if (sy === ey) { return base + '〜' + em + '月' + ed + '日'; }
  return base + '〜' + ey + '年' + em + '月' + ed + '日';
}
function tText(v){ return (v === null || v === undefined) ? '' : String(v); }
function tNorm(v){
  var s = tText(v);
  if (typeof s.normalize === 'function') { s = s.normalize('NFKC'); }
  return s.toLowerCase();
}
function tArr(v){ return (v instanceof Array) ? v : []; }

/* ---------- 1件ごとの表示用データ ---------- */
function tBuildView(t, index, today){
  var periods = tArr(t.periods);
  var resolved = [];
  var unresolved = 0;
  var i;
  for (i = 0; i < periods.length; i++) {
    var r = tPeriodRange(periods[i]);
    if (r) { resolved.push(r); } else { unresolved++; }
  }
  var group, sortKey, dateState;
  if (resolved.length === 0) {
    group = 'undated'; sortKey = 0; dateState = 'none';
  } else {
    var nextStart = null, lastEnd = 0;
    for (i = 0; i < resolved.length; i++) {
      var rg = resolved[i];
      if (rg.end.getTime() > lastEnd) { lastEnd = rg.end.getTime(); }
      if (rg.end.getTime() >= today.getTime()) {
        var cand = (rg.start.getTime() < today.getTime()) ? today.getTime() : rg.start.getTime();
        if (nextStart === null || cand < nextStart) { nextStart = cand; }
      }
    }
    dateState = (unresolved > 0) ? 'partial' : 'full';
    if (nextStart !== null) { group = 'upcoming'; sortKey = nextStart; }
    else if (unresolved > 0) { group = 'undated'; sortKey = 0; }     // 確定した日付はすべて過去だが、未確定の日付が残る
    else { group = 'finished'; sortKey = -lastEnd; }
  }
  var groups = [];
  var aud = tArr(t.audience_types);
  if (aud.length === 0) { aud = ['不明']; }
  for (i = 0; i < aud.length; i++) {
    var g = T_AUDIENCE_GROUP[aud[i]] || '不明';
    if (groups.indexOf(g) === -1) { groups.push(g); }
  }
  // 日付未取得の中での並び順だけに使う（開催日の判定には使わない）: ヒントの年が今年より前なら後ろへ
  var hintYear = /(\d{4})/.exec(tText(t.date_hint));
  var pastHint = (group === 'undated' && resolved.length === 0 && hintYear && parseInt(hintYear[1], 10) < today.getFullYear()) ? 1 : 0;
  // 検索の「種目」には、大会の主種目（primary_event_types）を使う。団体戦を構成する試合形式（component_match_types）は使わない。
  // 主種目が無い古い形式のデータは、検出した種目（event_types）で代用する
  var primary = (t.primary_event_types instanceof Array) ? t.primary_event_types : tArr(t.event_types);
  var types = primary.length ? primary.slice() : ['種目不明'];
  var hay = [t.title, t.venue, t.event_area, t.source_name, t.eligibility_text, t.eligibility_status, aud.join(' '), primary.join(' '), t.date_text, t.date_hint, t.deadline_text];
  return {
    t: t, index: index, group: group, sortKey: sortKey, dateState: dateState, ranges: resolved, groups: groups, types: types, pastHint: pastHint,
    hay: tNorm(hay.map(tText).join(' '))
  };
}

/* ---------- 絞り込み ---------- */
function tAnyTrue(map){
  for (var k in map) { if (map.hasOwnProperty(k) && map[k]) { return true; } }
  return false;
}
function tIsJuniorGroup(g){ return g === 'ジュニア' || g === '学生'; }
// 対象者の検索条件。未選択なら「すべて」。「ジュニアも表示」がOFFのときは、ジュニア・学生系を（選択されていても）除外する
// 対象者: 未選択＝すべて（ジュニア・学生系も自動では除外しない）。選択があれば、その区分のどれか（OR）
function tAudienceMatches(vm){
  var sel = tSelected(tState.groups);
  if (sel.length === 0) { return true; }
  for (var j = 0; j < vm.groups.length; j++) { if (sel.indexOf(vm.groups[j]) !== -1) { return true; } }
  return false;
}
// ジュニア・学生系の大会か（一般・ベテラン・対象者不明の併記がある大会は、除外の対象にしない。団体限定などの併記だけでは免れない）
function tIsJuniorOnly(vm){
  var hasJr = false, hasMain = false;
  for (var j = 0; j < vm.groups.length; j++) {
    var g = vm.groups[j];
    if (tIsJuniorGroup(g)) { hasJr = true; }
    if (g === '一般' || g === 'ベテラン' || g === '不明') { hasMain = true; }
  }
  return hasJr && !hasMain;
}
// 「シニア」と明記された大会だけを対象にする。ベテラン・壮年などは含めない。
// 一般・ベテラン・対象者不明の併記があれば、ジュニア除外と同じ考え方で残す。
function tIsSeniorOnly(vm){
  var basis = tArr(vm.t && vm.t.classification_basis), hasSenior = false, hasMain = false;
  for (var i = 0; i < basis.length; i++) {
    var b = basis[i] || {};
    if (b.field !== 'audience') { continue; }
    if (b.matched === 'シニア') { hasSenior = true; }
    if (b.matched === '一般' || b.matched === 'ベテラン' || b.matched === '不明') { hasMain = true; }
  }
  return hasSenior && !hasMain;
}
// 期間: 「全期間」は期間を理由に除外しない。期間指定で開始日・終了日が両方空欄のときも、期間条件を適用しない
function tEffectiveRange(){
  if (tState.period === 'all') { return { start: null, end: null }; }
  return { start: tParseIsoDate(tState.start), end: tParseIsoDate(tState.end) };
}
function tOverlaps(vm, range){
  for (var i = 0; i < vm.ranges.length; i++) {
    var r = vm.ranges[i];
    if (range.start && r.end.getTime() < range.start.getTime()) { continue; }
    if (range.end && r.start.getTime() > range.end.getTime()) { continue; }
    return true;
  }
  return false;
}
// 戻り値: 'ok'、または表示しない理由（area / type / keyword / date-undated / date-finished / period / audience）
// 選択されている項目（同一項目内の複数選択は OR。項目どうしは AND。未選択＝すべて）
function tSelected(map){
  var out = [];
  for (var k in map) { if (map.hasOwnProperty(k) && map[k]) { out.push(k); } }
  return out;
}
function tAreaOk(vm){ var sel = tSelected(tState.areas); return sel.length === 0 || sel.indexOf(tText(vm.t.event_area)) !== -1; }
function tTypeMatched(vm){
  var sel = tSelected(tState.types), out = [];
  for (var i = 0; i < vm.types.length; i++) { if (sel.indexOf(vm.types[i]) !== -1) { out.push(vm.types[i]); } }
  return out;
}
function tTypeOk(vm){ return tSelected(tState.types).length === 0 || tTypeMatched(vm).length > 0; }
// 対象者として明示的に選択された区分（「ジュニアも表示」がOFFのときのジュニア・学生は無効）。大会の対象者のうち、それに一致したもの
function tGroupSelectedEffective(){
  var sel = [];
  for (var i = 0; i < T_GROUPS.length; i++) { if (tState.groups[T_GROUPS[i]]) { sel.push(T_GROUPS[i]); } }
  return sel;
}
function tGroupMatched(vm){
  var sel = tGroupSelectedEffective(), out = [];
  if (!sel.length) { return out; }
  for (var i = 0; i < vm.groups.length; i++) { if (sel.indexOf(vm.groups[i]) !== -1) { out.push(vm.groups[i]); } }
  return out;
}
function tTerms(){
  var terms = tNorm(tState.keyword).split(/\s+/), out = [];
  for (var q = 0; q < terms.length; q++) { if (terms[q]) { out.push(terms[q]); } }
  return out;
}
// 検索結果のカードに出す一致理由。実際に判定へ使った（選択・入力された）条件だけを、判定と同じ関数で求める
function tMatchReason(vm){
  var parts = [];
  if (tSelected(tState.areas).length) { parts.push(tText(vm.t.event_area)); }
  parts = parts.concat(tGroupMatched(vm));
  parts = parts.concat(tTypeMatched(vm));
  var raw = tText(tState.keyword).replace(/^\s+|\s+$/g, '').split(/\s+/), kw = '';
  for (var i = 0; i < raw.length; i++) { if (raw[i]) { kw += '「' + raw[i] + '」'; } }
  if (kw) { parts.push('キーワード' + kw); }
  return parts.length ? '該当理由：' + parts.join('・') : '';
}
// 戻り値: 'ok'、または表示しない理由。非表示の件数は、この順で最初に当てはまる理由で、重複なく数える
//   area / type / keyword / audience（利用者が選んだ条件）→ excl-junior / excl-undated / excl-finished（利用者が「除外する」を選んだ条件）
//   → period-unknown（期間を指定したが、日付未取得で期間判定できない）/ period（期間外）
function tReason(vm, range, terms){
  if (!tAreaOk(vm)) { return 'area'; }
  if (!tTypeOk(vm)) { return 'type'; }
  for (var k = 0; k < terms.length; k++) { if (vm.hay.indexOf(terms[k]) === -1) { return 'keyword'; } }
  if (!tAudienceMatches(vm)) { return 'audience'; }
  if (tState.exclJunior && tIsJuniorOnly(vm)) { return 'excl-junior'; }
  if (tState.exclSenior && tIsSeniorOnly(vm)) { return 'excl-senior'; }
  var active = !!(range.start || range.end);
  if (vm.group === 'undated') {
    if (tState.exclUndated) { return 'excl-undated'; }
    if (active) { return 'period-unknown'; }
  } else if (vm.group === 'finished') {
    if (tState.exclFinished) { return 'excl-finished'; }
    if (!tOverlaps(vm, range)) { return 'period'; }
  } else {
    if (!tOverlaps(vm, range)) { return 'period'; }
  }
  return 'ok';
}

/* ---------- カード ---------- */

}

}
function tFormatDeadline(t){
  var d = tParseIsoDate(t.deadline_date);
  if (d) {
    var s = tFormatRange({ start: d, end: d });
    if (t.deadline_time) { s += ' ' + tText(t.deadline_time); }
    var raw = tText(t.deadline_text);
    return esc(s) + (raw ? '<span class="t-sub">原文: ' + esc(raw) + '</span>' : '') + tDeadlineStatus(d, t.deadline_time);
  }
  if (tText(t.deadline_text)) { return '<span class="t-raw">原文: ' + esc(t.deadline_text) + '</span>'; }
  return '未取得';
}
// 申込締切の状態（閲覧時の現在日時で判定。固定の日付ではない）
function tDeadlineStatus(d, time){
  var now = new Date();
  var end = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59);
  var m = /^(\d{1,2}):(\d{2})$/.exec(tText(time));
  if (m) { end = new Date(d.getFullYear(), d.getMonth(), d.getDate(), parseInt(m[1], 10), parseInt(m[2], 10), 0); }
  if (now.getTime() > end.getTime()) { return '<span class="t-sub t-dl closed">申込締切は終了しています</span>'; }
  var today = tTodayStart();
  var days = Math.round((d.getTime() - today.getTime()) / 86400000);
  return '<span class="t-sub t-dl open">' + (days <= 0 ? '本日が申込締切です' : '締切まであと' + days + '日') + '</span>';
}
function tFieldLabel(f){ return f === 'audience' ? '対象者' : (f === 'event_type' ? '種目' : (f === 'eligibility' ? '参加資格' : f)); }
function tRenderCard(vm){

  html += '<select id="tPeriod" class="t-select"><option value="all">全期間</option><option value="from_today">本日以降</option><option value="30">今日から30日</option><option value="90">今日から90日</option><option value="180">今日から180日</option><option value="custom">期間を指定</option></select></div>';

  html += '<div class="t-fnote">全期間・期間を指定（日付が空欄）は、期間で絞り込みません。期間を指定すると、日付未取得の大会は期間判定ができないため除かれます（その件数を表示します）。</div></div>';
  html += '<div class="t-fgroup"><div class="t-flabel">検索区分（情報元・未選択＝すべて）</div>' + tChecks('area', tAreaValues(data)) + '</div>';
  html += '<div class="t-fgroup"><div class="t-flabel">対象者（未選択＝すべて。ジュニア・学生系も含む）</div>' + tChecks('group', T_GROUPS) + '</div>';
  html += '<div class="t-fgroup"><div class="t-flabel">種目（未選択＝すべて。種目不明も含む）</div>' + tChecks('type', T_TYPES) + '</div>';
  html += '<div class="t-fgroup"><div class="t-flabel">キーワード（Enterでも検索できます）</div><input type="search" id="tKeyword" class="t-text" placeholder="大会名・会場など" autocomplete="off" enterkeyhint="search"></div>';
  html += '<div class="t-fgroup"><div class="t-flabel">除外する条件（ONにしたものだけ除外。初回はすべてOFF）</div><div class="t-checks"><label class="t-chk"><input type="checkbox" id="tExclJunior"> ジュニア・学生系を除外</label><label class="t-chk"><input type="checkbox" id="tExclSenior"> シニア系を除外</label><label class="t-chk"><input type="checkbox" id="tExclFinished"> 終了済みを除外</label><label class="t-chk"><input type="checkbox" id="tExclUndated"> 日付未取得を除外</label></div><div class="t-fnote">「シニア系」は分類でシニアと明記された大会のみです。ベテラン・壮年は除外しません。</div></div>';
  html += '<div class="t-footer"><div class="t-conflict" id="tConflict" role="alert" hidden>対象者でジュニア・学生系が選択されています。「ジュニア・学生系を除外」を解除してください。</div>';
  html += '<div class="t-dirty" id="tDirty" role="status" hidden>条件を変更しました。下の「この条件で検索」を押すと、検索結果に反映されます。</div>';
  html += '<div class="t-footer-actions"><button type="button" class="t-btn" id="tReset">条件をリセット</button><button type="button" class="t-btn" id="tSaveSearch">検索条件を保存</button></div>';
  html += '<div class="t-fnote">保存した条件はこのブラウザ内に保存され、次回起動時の初期条件になります。保存だけでは検索結果は変わりません。</div>';
  html += '<div class="t-save-status" id="tSaveStatus" role="status" aria-live="polite" hidden></div>';
  html += '<button type="button" class="t-btn-search" id="tSearch">この条件で検索</button></div>';
  return html + '</div></details>';
}
function tCoverageHtml(data){
  var html = '<b>情報源の対応状況</b><br>';
  var src = tArr(data.sources);
  var snaps = [];
  for (var i = 0; i < src.length; i++) {
    var s = src[i] || {};
    var cls = s.coverage === 'supported' ? 't-st-ok' : (s.coverage === 'partial' ? 't-st-part' : 't-st-none');
    html += esc(tText(s.name)) + '：<span class="' + cls + '">' + esc(tText(s.coverage_label)) + '</span>（' + esc(String(s.record_count)) + '件）';
    var us = (data.update && data.update.sources) ? data.update.sources[s.id] : null;
    if (us && us.status === 'stale') {
      var ad = tParseIsoDate(us.data_as_of);
      html += '<span class="t-st-none">（直近の更新に失敗。表示は' + (ad ? esc(tFormatRange({ start: ad, end: ad })) : '前回') + 'に取得したデータ）</span>';
    }
    html += '<br>';
    var d = tParseIsoDate(s.snapshot_date);
    if (d) {
      var snapLabel = tText(s.name) + ' ' + tFormatRange({ start: d, end: d });
      var pd = tParseIsoDate(s.pdf_confirmed_on);
      if (pd) { snapLabel += '（要項PDF確認 ' + tFormatRange({ start: pd, end: pd }) + '）'; }
      snaps.push(snapLabel);
    }
  }
  var o = data.other_areas || {};
  html += esc(tText(o.label) || 'その他エリア') + '：<span class="t-st-none">' + esc(tText(o.coverage_label) || '未対応') + '</span><br>';
  if (snaps.length) { html += '資料時点（保存HTMLの受領日）: ' + esc(snaps.join(' ／ ')) + '<br>'; }
  html += '「対応済み」は、保存した公式ページを取り込み済みという意味で、公式サイトの最新状態を常時取得しているわけではありません。';
  if (tournamentFromCache) { html += '<br><span class="t-st-none">通信できないため、端末に保存済みの大会データを表示しています（前回取得できたデータです）。</span>'; }
  return html;
}

function tSyncPanel(){
  var el = document.getElementById('tFilters');
  if (!el) { return; }
  document.getElementById('tPeriod').value = tState.period;
  document.getElementById('tStart').value = tState.start;
  document.getElementById('tEnd').value = tState.end;
  document.getElementById('tKeyword').value = tState.keyword;
  document.getElementById('tExclJunior').checked = !!tState.exclJunior;
  document.getElementById('tExclSenior').checked = !!tState.exclSenior;
  document.getElementById('tExclFinished').checked = !!tState.exclFinished;
  document.getElementById('tExclUndated').checked = !!tState.exclUndated;
  tSyncBoxes(function(kind, v){ return (kind === 'area') ? !!tState.areas[v] : (kind === 'group' ? !!tState.groups[v] : !!tState.types[v]); });
  tMarkDirty();
}
// チェックボックスの見た目を揃える（対象者のジュニア・学生は常に選べる）
function tSyncBoxes(isOn){
  var boxes = document.getElementById('tFilters').querySelectorAll('input.tChk');
  for (var i = 0; i < boxes.length; i++) {
    var b = boxes[i], on = isOn ? isOn(b.getAttribute('data-kind'), b.value) : b.checked;
    b.checked = on;
    b.parentNode.className = 't-chk' + (on ? ' on' : '');
  }
}
function tApplyPreset(p){
  var today = tTodayStart();
  tState.period = p;
  if (p === 'from_today') { tState.start = tIso(today); tState.end = ''; }
  else if (p === '30' || p === '90' || p === '180') { tState.start = tIso(today); tState.end = tIso(tAddDays(today, parseInt(p, 10))); }
  else if (p === 'all') { tState.start = ''; tState.end = ''; }
}
// 条件欄（下書き）の内容を、検索条件として読み取る（この時点では適用しない）
function tReadPanel(){
  var st = tDefaultState();
  st.period = document.getElementById('tPeriod').value;
  st.start = document.getElementById('tStart').value;
  st.end = document.getElementById('tEnd').value;
  st.keyword = document.getElementById('tKeyword').value;
  st.exclJunior = document.getElementById('tExclJunior').checked;
  st.exclSenior = document.getElementById('tExclSenior').checked;
  st.exclFinished = document.getElementById('tExclFinished').checked;
  st.exclUndated = document.getElementById('tExclUndated').checked;
  var boxes = document.getElementById('tFilters').querySelectorAll('input.tChk');
  for (var i = 0; i < boxes.length; i++) {
    var b = boxes[i], kind = b.getAttribute('data-kind');
    if (kind === 'area') { st.areas[b.value] = b.checked; }
    else if (kind === 'group') { st.groups[b.value] = b.checked; }
    else { st.types[b.value] = b.checked; }
  }
  return st;
}
// 条件の同一性の判定用（期間のプリセットの開始日・終了日は、日付が変わっても同じ条件として扱う）
function tSig(st){
  var sel = function(map){ var o = []; for (var k in map) { if (map.hasOwnProperty(k) && map[k]) { o.push(k); } } return o.sort().join(','); };
  return [st.period, st.period === 'custom' ? st.start + '~' + st.end : '', sel(st.areas), sel(st.groups), sel(st.types), st.keyword, st.exclJunior ? 1 : 0, st.exclSenior ? 1 : 0, st.exclFinished ? 1 : 0, st.exclUndated ? 1 : 0].join('|');
}
var tSavedSearchSig = null;
function tSetSaveButtonSaved(isSaved){
  var button = document.getElementById('tSaveSearch');
  if (!button) { return; }
  button.classList.toggle('t-btn-saved', !!isSaved);
  button.textContent = isSaved ? '保存済み ✓' : '検索条件を保存';
}
function tUpdateSaveButton(st){
  tSetSaveButtonSaved(tSavedSearchSig !== null && tSig(st) === tSavedSearchSig);
}
// 矛盾する指定: 対象者でジュニア・学生が選ばれているのに、「ジュニア・学生系を除外」がON
function tConflictOf(st){ return !!(st.exclJunior && (st.groups['ジュニア'] || st.groups['学生'])); }
function tShowConflict(on){
  var c = document.getElementById('tConflict');
  if (c) { c.hidden = !on; }
}
// 条件欄を変更したが、まだ検索していない場合に、その旨を表示する（検索結果は変えない）。矛盾する指定は警告する
function tMarkDirty(){
  var d = document.getElementById('tDirty');
  if (!d || !document.getElementById('tPeriod')) { return; }
  var saved = document.getElementById('tSaveStatus');
  if (saved) { saved.hidden = true; }
  var draft = tReadPanel();
  tUpdateSaveButton(draft);
  d.hidden = (tSig(draft) === tSig(tState));
  tShowConflict(tConflictOf(draft));
}
// 検索の実行（「この条件で検索」・Enter・「条件をリセット」）: 条件を適用 → 結果を更新 → 条件欄を閉じる → 検索結果の先頭へスクロール
// 矛盾する指定（対象者のジュニア・学生 ＋ 「ジュニア・学生系を除外」）のときは、検索を実行せず、警告を表示する
function tRunSearch(){
  if (!document.getElementById('tFilters')) { return; }
  var draft = tReadPanel();
  if (tConflictOf(draft)) {
    tShowConflict(true);
    var c = document.getElementById('tConflict');
    try { c.scrollIntoView({ block: 'center' }); } catch (e) { /* 表示だけの問題 */ }
    return;
  }
  tState = draft;
  if (tState.period !== 'custom') { tApplyPreset(tState.period); }
  tSearched = true;
  tSyncPanel();
  tRenderResults();
  document.getElementById('tFilters').open = false;
  var ae = document.activeElement;
  if (ae && ae !== document.body && ae.blur && ae.id !== 'tSearch' && ae.id !== 'tReset') { ae.blur(); }
  tScrollToResults();
}
function tScrollToResults(){
  var target = document.getElementById('tFound') || document.getElementById('tSummary');
  if (!target) { return; }
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  try { target.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }
  catch (e) { window.scrollTo(0, target.getBoundingClientRect().top + (window.pageYOffset || 0) - 8); }
}
function tBindPanel(){
  var el = document.getElementById('tFilters');
  if (!el) { return; }
  // 条件欄の操作は、検索結果を変えない（変更を下書きとして保持し、「未反映」の表示を出すだけ）
  document.getElementById('tPeriod').addEventListener('change', function(){
    var v = this.value, today = tTodayStart(), s = document.getElementById('tStart'), e = document.getElementById('tEnd');
    if (v === 'from_today') { s.value = tIso(today); e.value = ''; }
    else if (v === '30' || v === '90' || v === '180') { s.value = tIso(today); e.value = tIso(tAddDays(today, parseInt(v, 10))); }
    else if (v === 'all') { s.value = ''; e.value = ''; }
    tMarkDirty();
  });
  var onDate = function(){ document.getElementById('tPeriod').value = 'custom'; tMarkDirty(); };
  document.getElementById('tStart').addEventListener('change', onDate);
  document.getElementById('tEnd').addEventListener('change', onDate);
  document.getElementById('tKeyword').addEventListener('input', tMarkDirty);
  document.getElementById('tKeyword').addEventListener('keydown', function(ev){
    // Enterで検索（日本語入力の変換確定のEnterでは検索しない）
    if ((ev.key === 'Enter' || ev.keyCode === 13) && !ev.isComposing && ev.keyCode !== 229) { ev.preventDefault(); tRunSearch(); }
  });
  ['tExclJunior', 'tExclSenior', 'tExclFinished', 'tExclUndated'].forEach(function(id){ document.getElementById(id).addEventListener('change', tMarkDirty); });
  var boxes = el.querySelectorAll('input.tChk');
  for (var i = 0; i < boxes.length; i++) {
    boxes[i].addEventListener('change', function(){ tSyncBoxes(null); tMarkDirty(); });
  }
  document.getElementById('tSearch').addEventListener('click', tRunSearch);
  document.getElementById('tSaveSearch').addEventListener('click', function(){
    var draft = tReadPanel(), status = document.getElementById('tSaveStatus');
    if (tConflictOf(draft)) {
      tShowConflict(true);
      var conflict = document.getElementById('tConflict');
      if (conflict) { try { conflict.scrollIntoView({ block: 'center' }); } catch (e) {} }
      return;
    }
    if (draft.period !== 'custom') { draft.start = ''; draft.end = ''; }
    var ok = tSaveSearchPreferences(draft);
    if (ok) { tSavedSearchSig = tSig(draft); }
    tUpdateSaveButton(draft);
    if (status) { status.textContent = ok ? '検索条件を保存しました。次回起動時から、この条件で始まります。現在の検索結果は変わりません。' : '保存できませんでした。ブラウザの保存領域を確認してください。'; status.hidden = false; }
  });
  document.getElementById('tReset').addEventListener('click', function(){
    tClearSearchPreferences(); // リセットでは、保存済みの個人条件も解除する
    tSavedSearchSig = null;
    tState = tDefaultState(); tApplyPreset('all');   // 全項目を標準条件（全件）へ戻して、検索を実行する
    tSyncPanel();
    tRunSearch();
  });
}

/* ---------- 結果の描画 ---------- */
function tConditionText(){
  // 実際に適用している条件だけを表示する（未選択の項目は表示しない。何も無ければ「すべての大会」）
  var parts = [];
  var pl = { from_today: '本日以降', '30': '今日から30日', '90': '今日から90日', '180': '今日から180日' };
  if (tState.period === 'custom') {
    if (tState.start || tState.end) { parts.push('期間：' + (tState.start || '指定なし') + '〜' + (tState.end || '指定なし')); }
  } else if (tState.period !== 'all') { parts.push('期間：' + pl[tState.period]); }
  var sel = tSelected(tState.areas);
  if (sel.length) { parts.push('検索区分：' + sel.join('・')); }
  var gs = tGroupSelectedEffective();
  if (gs.length) { parts.push('対象者：' + gs.join('・')); }
  var ts = tSelected(tState.types);
  if (ts.length) { parts.push('種目：' + ts.join('・')); }
  if (tText(tState.keyword).replace(/\s+/g, '')) { parts.push('キーワード：「' + tText(tState.keyword) + '」'); }
  var ex = [];
  if (tState.exclJunior) { ex.push('ジュニア・学生系'); }
  if (tState.exclSenior) { ex.push('シニア系'); }
  if (tState.exclFinished) { ex.push('終了済み'); }
  if (tState.exclUndated) { ex.push('日付未取得'); }
  if (ex.length) { parts.push('除外：' + ex.join(' ／ ')); }
  return parts.length ? parts.join(' ／ ') : 'すべての大会';
}
function tZeroHtml(data, hiddenInfo){
  var html = '<div class="t-zero"><b>条件に合う大会はありません。</b><br>';
  html += 'この結果は「大会がない」とは限りません。大会情報を取得できている情報源に限った検索結果です。<br>';
  var selected = [];
  for (var k in tState.areas) { if (tState.areas.hasOwnProperty(k) && tState.areas[k]) { selected.push(k); } }
  var src = tArr(data.sources);
  for (var i = 0; i < src.length; i++) {
    var s = src[i] || {};
    if (selected.length && selected.indexOf(tText(s.event_area)) === -1) { continue; }
    html += '・' + esc(tText(s.name)) + '：' + esc(tText(s.coverage_label)) + (s.coverage === 'supported' ? '' : '（' + esc(tText(s.coverage_note)) + '）') + '<br>';
  }
  var o = data.other_areas || {};
  html += '・' + esc(tText(o.label) || 'その他エリア') + '：' + esc(tText(o.coverage_label) || '未対応') + '（検索対象外。大会情報を取得していません）<br>';
  if (hiddenInfo) { html += hiddenInfo; }
  return html + '</div>';
}
function tRenderResults(){
  var data = tournamentDataCache;
  var sumEl = document.getElementById('tSummary');
  var resEl = document.getElementById('tResults');
  if (!data || !sumEl || !resEl) { return; }
  var filterPanel = document.getElementById('tFilters');
  var coveragePanel = document.getElementById('tCoverage');
  if (filterPanel) { filterPanel.hidden = favoriteView; }
  if (coveragePanel) { coveragePanel.hidden = favoriteView; }
  updateFavoritesToolbar();
  if (favoriteView) {
    var byId = {};
    var allTournaments = tArr(data.tournaments);
    for (var fi = 0; fi < allTournaments.length; fi++) {
      if (allTournaments[fi] && typeof allTournaments[fi] === 'object' && tText(allTournaments[fi].id)) { byId[tText(allTournaments[fi].id)] = allTournaments[fi]; }
    }
    sumEl.innerHTML = '<div class="t-summary">お気に入り ' + favoriteIds.length + '件</div>';
    if (!favoriteIds.length) { resEl.innerHTML = '<div class="empty">お気に入りはまだありません。大会カードの☆を押すと、ここに保存されます。</div>'; return; }
    var favHtml = '';
    for (var fj = 0; fj < favoriteIds.length; fj++) {
      var favTournament = byId[favoriteIds[fj]];
      if (favTournament) {
        favHtml += tRenderCard(tBuildView(favTournament, fj, tTodayStart()));
      } else {
        favHtml += '<div class="tcard" data-id="' + esc(favoriteIds[fj]) + '"><div class="t-titleline"><div class="tcard-title">この大会は現在の掲載データにありません</div><button class="t-fav-btn" type="button" data-fav-id="' + esc(favoriteIds[fj]) + '" aria-pressed="true" aria-label="お気に入りから削除" title="お気に入りから削除">★</button></div><div class="t-hint">大会データから見つかりません。不要なら★を押して削除できます。</div></div>';
      }
    }
    resEl.innerHTML = favHtml;
    return;
  }
  if (filterPanel) { filterPanel.hidden = false; }
  if (coveragePanel) { coveragePanel.hidden = false; }
  var today = tTodayStart();
  var range = tEffectiveRange();
  var rangeBad = !!(range.start && range.end && range.start.getTime() > range.end.getTime());
  var terms = tNorm(tState.keyword).split(/\s+/);
  var cleanTerms = [];
  for (var q = 0; q < terms.length; q++) { if (terms[q]) { cleanTerms.push(terms[q]); } }

  var views = [];
  var list = tArr(data.tournaments);
  for (var i = 0; i < list.length; i++) { if (list[i] && typeof list[i] === 'object') { views.push(tBuildView(list[i], i, today)); } }

  var shown = { upcoming: [], undated: [], finished: [] };
  var hidden = { periodUnknown: 0, exclJunior: 0, exclSenior: 0, exclFinished: 0, exclUndated: 0 };
  var shownCount = 0;
  var periodActive = !!(range.start || range.end);
  for (var j = 0; j < views.length; j++) {
    var vm = views[j];
    var reason = rangeBad ? 'period' : tReason(vm, range, cleanTerms);
    if (reason === 'ok') { shown[vm.group].push(vm); shownCount++; }
    else if (reason === 'period-unknown') { hidden.periodUnknown++; }
    else if (reason === 'excl-junior') { hidden.exclJunior++; }
    else if (reason === 'excl-senior') { hidden.exclSenior++; }
    else if (reason === 'excl-finished') { hidden.exclFinished++; }
    else if (reason === 'excl-undated') { hidden.exclUndated++; }
  }
  shown.upcoming.sort(function(a, b){ return (a.sortKey - b.sortKey) || (a.index - b.index); });
  shown.finished.sort(function(a, b){ return (a.sortKey - b.sortKey) || (a.index - b.index); });
  shown.undated.sort(function(a, b){ return (a.pastHint - b.pastHint) || (a.index - b.index); });

  var foundHtml = tSearched ? '<div class="t-found" id="tFound" role="status" aria-live="polite">' + shownCount + '件見つかりました</div>' : '';
  sumEl.innerHTML = foundHtml + '<div class="t-summary">' + shownCount + '件を表示（全' + views.length + '件中）</div><div class="t-hint" id="tConditions">表示条件：' + esc(tConditionText()) + '</div>';
  // 除外・期間判定できない件数の案内（実際に適用した条件に関するものだけ）
  var hiddenHtml = '';
  if (periodActive && !rangeBad) { hiddenHtml += '<span id="tPeriodUnknown">日付未取得のため期間判定できない大会：' + hidden.periodUnknown + '件</span><br>'; }
  var ex = [];
  if (tState.exclJunior) { ex.push('ジュニア・学生系 ' + hidden.exclJunior + '件'); }
  if (tState.exclSenior) { ex.push('シニア系 ' + hidden.exclSenior + '件'); }
  if (tState.exclFinished) { ex.push('終了済み ' + hidden.exclFinished + '件'); }
  if (tState.exclUndated) { ex.push('日付未取得 ' + hidden.exclUndated + '件'); }
  if (ex.length) { hiddenHtml += '<span id="tExcluded">除外した大会：' + esc(ex.join(' ／ ')) + '</span><br>'; }
  if (rangeBad) { hiddenHtml += '開始日が終了日より後になっています。期間を見直してください。<br>'; }
  if (hiddenHtml) { sumEl.innerHTML += '<div class="t-hint">' + hiddenHtml + '</div>'; }

  var html = '';
  if (shownCount === 0) { html += tZeroHtml(data, hiddenHtml); }
  var titles = { upcoming: '開催予定の大会', undated: '日付未取得・未確定の大会（別枠）', finished: '終了済みの大会' };
  var order = ['upcoming', 'undated', 'finished'];
  for (var g = 0; g < order.length; g++) {
    var items = shown[order[g]];
    if (items.length === 0) { continue; }
    html += '<div class="t-group" data-group="' + order[g] + '">' + titles[order[g]] + '<span class="t-count">' + items.length + '件</span></div>';
    for (var m = 0; m < items.length; m++) { html += tRenderCard(items[m]); }
  }
  resEl.innerHTML = html;
}

document.getElementById('favoritesToggle').addEventListener('click', function(){
  favoriteView = !favoriteView;
  updateFavoritesToolbar();
  tRenderResults();
});
document.getElementById('tournamentArea').addEventListener('change', function(e){
  if (!e.target) { return; }
  if (e.target.id === 'textSizePreference') {
    textSizePreference = e.target.value;
    applyTextSizePreference(textSizePreference);
    saveTextSizePreference(textSizePreference);
    return;
  }
  if (e.target.id !== 'hideAcquisitionDetails') { return; }
  hideAcquisitionDetails = !!e.target.checked;
  saveHideAcquisitionDetails(hideAcquisitionDetails);
  tRenderResults();
});
document.getElementById('tournamentArea').addEventListener('click', function(e){
  var node = e.target;
  while (node && node !== this && !(node.classList && node.classList.contains('t-fav-btn'))) { node = node.parentNode; }
  if (!node || node === this) { return; }
  toggleFavoriteTournament(node.getAttribute('data-fav-id'));
  tRenderResults();
});

function renderTournamentData(data){
  if (!data || !(data.tournaments instanceof Array)) { throw new Error('invalid tournament data'); }
  var el = document.getElementById('tournamentArea');
  if (!el) { return; }
  if (data.tournaments.length === 0) {
    tournamentDataCache = data;
    showTournamentState('empty', []);
    return;
  }
  var firstTime = !document.getElementById('tFilters');
  tournamentDataCache = data;
  if (firstTime) {
    tState = tLoadSearchPreferences(data);
    if (tState.period !== 'custom') { tApplyPreset(tState.period); }
    try { tSavedSearchSig = localStorage.getItem(SEARCH_PREFERENCES_KEY) ? tSig(tState) : null; } catch (e) { tSavedSearchSig = null; }
    el.innerHTML = tPanelHtml(data) + tDisplaySettingsHtml() + '<div class="t-cover" id="tCoverage">' + tCoverageHtml(data) + '</div><div id="tSummary"></div><div id="tResults"></div>';
    tBindPanel();
    tSyncPanel();
  } else {
    var cov = document.getElementById('tCoverage');
    if (cov) { cov.innerHTML = tCoverageHtml(data); }
  }
  tRenderResults();
}

function showTournamentLoading(){
  var el = document.getElementById('tournamentArea');
  if (el) { el.innerHTML = '<div class="empty">大会情報を読み込み中…</div>'; }
}

// 大会データのURLには、アプリの版を付ける（画面と大会データの版を一致させる）。
// 旧版のService Workerは、保存済みの旧データを返すことがあるため、新しいService Workerが有効になった時に、1回だけ静かに再取得する（再読み込みはしない）
var APP_DATA_VERSION = '0.8.7';
var tDataRefreshed = false;
function loadTournamentData(silent){
  if (!silent) { showTournamentLoading(); }
  // file:// で開いた場合、ブラウザの仕様でJSONを読み込めないため、取得を試みずに読み込み失敗として表示する
  if (typeof fetch !== 'function' || location.protocol === 'file:') {
    if (!silent) { tournamentLoadFailed = true; showTournamentState('error', []); }
    return;
  }
  fetch(TOURNAMENT_DATA_URL + '?v=' + APP_DATA_VERSION, { cache: 'no-cache' })
    .then(function(res){
      if (!res.ok) { throw new Error('HTTP ' + res.status); }
      tournamentFromCache = (res.headers.get('X-Served-From-Cache') === 'fallback');
      return res.json();
    })
    .then(function(data){
      // 静かな再取得では、空・不正なデータで、表示中のデータを上書きしない
      if (silent && (!data || !(data.tournaments instanceof Array) || data.tournaments.length === 0)) { return; }
      renderTournamentData(data);
      tournamentLoadFailed = false;
    })
    .catch(function(err){
      if (silent) { return; }   // 静かな再取得の失敗は、表示中のデータをそのまま保持する
      tournamentLoadFailed = true;
      tournamentDataCache = null;
      console.warn('Tournament data could not be loaded.', err);
      showTournamentState('error', []);
    });
}
if (typeof navigator !== 'undefined' && navigator.serviceWorker && navigator.serviceWorker.addEventListener) {
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (tDataRefreshed) { return; }   // 1ページにつき1回だけ（再読み込みはしないので、無限ループは起きない）
    tDataRefreshed = true;
    loadTournamentData(true);
  });
}

(function bindTournamentRefresh(){
  var nav = document.getElementById('navResearch');
  if (!nav) { return; }
  nav.addEventListener('click', function(){
    // リサーチ画面を開くたびに、その日の日付で並べ直す。前回の読み込みに失敗していた場合は再読み込みする。
    if (tournamentDataCache && document.getElementById('tFilters')) { try { tApplyPresetKeep(); tRenderResults(); } catch (e) { /* 表示だけの問題。予定には影響しない */ } }
    else if (tournamentDataCache) { try { renderTournamentData(tournamentDataCache); } catch (e) { /* 同上 */ } }
    else if (tournamentLoadFailed) { loadTournamentData(); }
  });
})();
// 日付をまたいで開いたままの場合に、プリセットの期間（本日以降／30日／90日／180日）を今日の日付へ更新する（利用者が指定した期間は変えない）
function tApplyPresetKeep(){
  if (tState.period !== 'custom' && tState.period !== 'all') { tApplyPreset(tState.period); tSyncPanel(); }
}

loadTournamentData();
/* TOURNAMENT-DATA:END */
</script>
