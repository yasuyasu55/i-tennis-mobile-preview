name: shinshiro-source-probe
on:
  push:
    branches: [shinshiro-source-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-pipeline.txt
      - run: python tools/probe_shinshiro.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shinshiro-source-evidence
          path: probe_out/shinshiro.json
          retention-days: 14
