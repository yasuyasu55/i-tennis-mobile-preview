name: Verify Nagoya expansion
on:
  push:
    branches: [nagoya-source-preview]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: current-public
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Offline regression tests
        run: python -m unittest discover -s tests/pipeline -q
      - name: Seed approved public data
        run: cp current-public/data/tournaments.json data/tournaments.json
      - name: Fetch Nagoya only
        run: python pipeline/run_update.py --dry-run --only nagoya --out-dir pipeline/out-nagoya
      - name: Verify proposed expansion and preservation
        run: |
          python pipeline/validate.py pipeline/out-nagoya/proposed/tournaments.json
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('pipeline/out-nagoya')
          summary=json.loads((out/'summary.json').read_text())
          old=json.loads(Path('current-public/data/tournaments.json').read_text())
          new=json.loads((out/'proposed/tournaments.json').read_text())
          assert summary['results']['nagoya']['status']=='ok',summary
          old_rows=old['tournaments']; new_rows=new['tournaments']
          assert len(old_rows)==107
          assert [r for r in new_rows if r['source_id']!='nagoya_tennis_association']==old_rows
          added=[r for r in new_rows if r['source_id']=='nagoya_tennis_association']
          assert len(added)==3
          assert sorted(r['periods'][0]['normalized'] for r in added)==['2026-05-17','2027-01-24','2027-03-14']
          for r in added:
              assert '50歳以上' not in str(r)
              if r['primary_event_types']==['ミックス']:
                  assert all(r[f] is None for f in ('venue','fee_text','deadline_date','entry_url'))
          print('Nagoya live verification passed: 3 added; all 107 previous records unchanged')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nagoya-proposed
          path: |
            pipeline/out-nagoya/summary.json
            pipeline/out-nagoya/proposed/*.json
          retention-days: 14
