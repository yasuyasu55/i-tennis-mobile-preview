name: anjo-kariya-probe
on:
  push:
    branches: [anjo-kariya-source-preview]
    paths: [pipeline/probe_anjo_kariya.py, .github/workflows/anjo-kariya-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.14.3
      - run: python -u pipeline/probe_anjo_kariya.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: anjo-kariya-probe
          path: pipeline/out-probe
          retention-days: 1
