name: all-sources-dryrun

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '確認文字列: all-sources-dry-run'
        required: true
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: all-sources-dryrun
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Reject unconfirmed runs
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != 'all-sources-dry-run' ]; then
            echo '確認文字列が一致しません'
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: hamamatsu-r5-candidate

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PDF text extraction tool
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install pinned pipeline dependencies
        run: python -m pip install -r requirements-pipeline.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests/pipeline

      - name: Run all enabled sources as a read-only dry-run
        run: python pipeline/run_update.py --dry-run

      - name: Compare proposed records with current public data
        run: |
          git fetch --depth=1 origin main
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          current = json.loads(subprocess.check_output(['git', 'show', 'FETCH_HEAD:data/tournaments.json']))
          proposed = json.loads(Path('pipeline/out/proposed/tournaments.json').read_text(encoding='utf-8'))
          summary = json.loads(Path('pipeline/out/run-summary.json').read_text(encoding='utf-8'))
          old = {r['id']: r for r in current['tournaments']}
          new = {r['id']: r for r in proposed['tournaments']}
          if len(old) != len(current['tournaments']) or len(new) != len(proposed['tournaments']):
              raise SystemExit('重複IDを検出しました')
          print('## 公開中データとの比較')
          print(f"公開中 {len(old)}件 → 候補 {len(new)}件")
          for source in sorted({r.get('source_id','') for r in old.values()} | {r.get('source_id','') for r in new.values()}):
              o = {i:r for i,r in old.items() if r.get('source_id') == source}
              n = {i:r for i,r in new.items() if r.get('source_id') == source}
              added, removed = sorted(set(n)-set(o)), sorted(set(o)-set(n))
              changed = []
              for rid in sorted(set(o)&set(n)):
                  fields = [k for k in sorted(set(o[rid])|set(n[rid])) if o[rid].get(k) != n[rid].get(k) and k != 'source_snapshot_date']
                  if fields:
                      changed.append((n[rid].get('title',rid), fields))
              print(f"- {source}: {len(o)}→{len(n)}件、新規{len(added)}・消失{len(removed)}・項目変更{len(changed)}")
              for title, fields in changed:
                  print(f"  - {title}: {', '.join(fields)}")
              if added:
                  print('  - 新規: ' + ' / '.join(n[i].get('title',i) for i in added))
              if removed:
                  print('  - 候補から消失: ' + ' / '.join(o[i].get('title',i) for i in removed))
              key = source.replace('_tennis_association','')
              result = summary.get('results', {}).get(key)
              if result and result.get('status') == 'failed' and (o != {i:new[i] for i in o if i in new}):
                  raise SystemExit(f'取得失敗した情報源の前回データが変化しています: {source}')
          print('## 取得失敗時の前回データ保持: 検証完了')
          PY

      - name: Validate proposed data
        run: python pipeline/validate.py pipeline/out/proposed/tournaments.json

      - name: Add run summary
        if: always()
        run: |
          if [ -f pipeline/out/summary.md ]; then
            cat pipeline/out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save report and proposed JSON (no raw HTML/PDF)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: all-sources-dryrun-result
          path: |
            pipeline/out/summary.md
            pipeline/out/run-summary.json
            pipeline/out/proposed/tournaments.json
            pipeline/out/proposed/update-log.json
            pipeline/out/proposed/tournament-state.json
            pipeline/out/proposed/tournament-history.json
            !pipeline/out/raw
          retention-days: 14
          if-no-files-found: ignore
