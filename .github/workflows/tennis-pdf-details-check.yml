name: tennis-pdf-details-check
on:
  push:
    branches: [tennis-pdf-details-preview]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: main
          path: baseline
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -r requirements-pipeline.txt
      - run: python -m unittest discover -s tests/pipeline
      - name: Read-only live collection for two sources
        run: |
          cp baseline/data/tournaments.json baseline-tournaments.json
          cp baseline/data/tournaments.json data/tournaments.json
          python pipeline/run_update.py --only okazaki,hamamatsu --dry-run
          python pipeline/validate.py pipeline/out/proposed/tournaments.json
          python tools/verify_pdf_detail_candidate.py
          git -C baseline diff --exit-code
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tennis-pdf-details-evidence
          path: |
            pipeline/out/run-summary.json
            pipeline/out/summary.md
            pipeline/out/detail-comparison.json
            pipeline/out/proposed/*.json
          retention-days: 14
          if-no-files-found: error
