name: tennis-pdf-details-check
on:
  push:
    branches: [tennis-pdf-details-preview]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-pipeline.txt
      - run: python -m unittest discover -s tests/pipeline
      - run: python tools/probe_pdf_details.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tennis-pdf-details-evidence
          path: details_out/
          retention-days: 7
