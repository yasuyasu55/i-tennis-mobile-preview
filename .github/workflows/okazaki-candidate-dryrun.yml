name: okazaki-candidate-dryrun

on:
  # 全6情報源のall-sources-updateに定期実行を統合。手動確認用として維持。
  workflow_dispatch:
    inputs:
      confirm:
        description: '確認文字列: okazaki-dry-run'
        required: true
        type: string
        default: ''

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Reject unconfirmed manual runs
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != 'okazaki-dry-run' ]; then
            echo '確認文字列が一致しません'
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: hamamatsu-r5-candidate

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned pipeline dependencies
        run: python -m pip install -r requirements-pipeline.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests/pipeline

      - name: Fetch and parse Okazaki only (dry-run)
        run: python pipeline/run_update.py --dry-run --only okazaki

      - name: Verify Okazaki result and preserve all other records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          current = json.loads(Path('data/tournaments.json').read_text(encoding='utf-8'))
          summary = json.loads(Path('pipeline/out/run-summary.json').read_text(encoding='utf-8'))
          proposed = json.loads(Path('pipeline/out/proposed/tournaments.json').read_text(encoding='utf-8'))
          result = summary.get('results', {}).get('okazaki')
          if not result or result.get('status') != 'ok':
              raise SystemExit(f"岡崎取得が成功していません: {result}")
          if summary.get('validation_errors'):
              raise SystemExit(f"検証エラー: {summary['validation_errors']}")
          def other_records(doc):
              return [r for r in doc.get('tournaments', []) if r.get('source_id') != 'okazaki_tennis_association']
          if other_records(current) != other_records(proposed):
              raise SystemExit('岡崎以外の大会データが変化しています')
          print(f"岡崎: {result.get('records')}件 / 他情報源: {len(other_records(current))}件のデータ不変 / 検証エラー0")
          PY

      - name: Add summary
        if: always()
        run: |
          if [ -f pipeline/out/summary.md ]; then cat pipeline/out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save dry-run report and candidate JSON (no raw HTML/PDF)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: okazaki-candidate-dryrun-result
          path: |
            pipeline/out/summary.md
            pipeline/out/run-summary.json
            pipeline/out/proposed/tournaments.json
            pipeline/out/proposed/update-log.json
            pipeline/out/proposed/tournament-state.json
            pipeline/out/proposed/tournament-history.json
            !pipeline/out/raw
          retention-days: 14
          if-no-files-found: ignore
